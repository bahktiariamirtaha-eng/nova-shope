<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <title>فروشگاه | Nova Digital</title>
    <link rel="stylesheet" href="shop.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body>
    <!-- ================= HEADER ================= -->
    <header><!-- هدر اصلی سایت --></header>
    <!-- ================= Breadcrumb ================= -->
    <section class="breadcrumb">
      <a href="index.html">خانه</a> <i class="fa-solid fa-angle-left"></i>
      <span>فروشگاه</span>
    </section>
    <!-- ================= SHOP ================= -->
    <section class="shop">
      <!-- Sidebar -->
      <aside class="shop-sidebar">
        <h2>فیلتر محصولات</h2>
        <div class="filter-box">
          <h3>دسته بندی</h3>
          <label><input type="checkbox" /> لپ تاپ</label>
          <label><input type="checkbox" /> موبایل</label>
          <label><input type="checkbox" /> مانیتور</label>
          <label><input type="checkbox" /> هدفون</label>
          <label><input type="checkbox" /> لوازم جانبی</label>
        </div>
        <div class="filter-box">
          <h3>برند</h3>
          <label><input type="checkbox" /> ASUS</label>
          <label><input type="checkbox" /> Apple</label>
          <label><input type="checkbox" /> Samsung</label>
          <label><input type="checkbox" /> Lenovo</label>
          <label><input type="checkbox" /> MSI</label>
          <label><input type="checkbox" /> HP</label>
        </div>
        <div class="filter-box">
          <h3>محدوده قیمت</h3>
          <input type="range" />
        </div>
      </aside>
      <!-- Content -->
      <main class="shop-content">
        <!-- لپ تاپ -->
        <section class="shop-section">
          <div class="section-header">
            <h2>💻 لپ تاپ</h2>
            <a href="#">مشاهده همه</a>
          </div>
          <div class="products-grid" id="laptops"></div>
        </section>
        <!-- موبایل -->
        <section class="shop-section">
          <div class="section-header">
            <h2>📱 موبایل</h2>
            <a href="#">مشاهده همه</a>
          </div>
          <div class="products-grid" id="mobiles"></div>
        </section>
        <!-- مانیتور -->
        <section class="shop-section">
          <div class="section-header">
            <h2>🖥 مانیتور</h2>
            <a href="#">مشاهده همه</a>
          </div>
          <div class="products-grid" id="monitors"></div>
        </section>
        <!-- هدفون -->
        <section class="shop-section">
          <div class="section-header">
            <h2>🎧 هدفون</h2>
            <a href="#">مشاهده همه</a>
          </div>
          <div class="products-grid" id="headphones"></div>
        </section>
        <!-- لوازم جانبی -->
        <section class="shop-section">
          <div class="section-header">
            <h2>⌨️ لوازم جانبی</h2>
            <a href="#">مشاهده همه</a>
          </div>
          <div class="products-grid" id="accessories"></div>
        </section>
      </main>
    </section>
    <!-- ================= FOOTER ================= -->
    <footer><!-- فوتر اصلی سایت --></footer>
    <script src="shop.js"></script>
  </body>
</html>
