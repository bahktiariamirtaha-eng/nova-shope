<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <title>فروشگاه | Nova Digital</title>

    <link rel="stylesheet" href="shop.css" />
  </head>
  <body>
    <script src="icons.js"></script>
    <!-- ================= HEADER ================= -->

    <header>
      <div class="header-container">
        <!-- دایره + آیکون‌ها -->
        <div class="header-actions">
          <button
            class="header-menu-toggle"
            type="button"
            aria-label="باز کردن منو"
          >
            <svg class="icon"><use href="#icon-ellipsis"></use></svg>
          </button>

          <div class="header-menu-items">
            <a
              href="favorites.html"
              class="header-menu-item"
              aria-label="علاقه‌مندی‌ها"
            >
              <svg class="icon"><use href="#icon-heart-outline"></use></svg>
            </a>

            <a
              href="account.html"
              class="header-menu-item"
              aria-label="حساب کاربری"
            >
              <svg class="icon"><use href="#icon-user"></use></svg>
            </a>

            <a href="cart.html" class="header-menu-item" aria-label="سبد خرید">
              <svg class="icon"><use href="#icon-cart-shopping"></use></svg>
            </a>
          </div>
        </div>
      </div>
    </header>

    <!-- ================= BREADCRUMB ================= -->

    <section class="breadcrumb">
      <a href="index.html"> خانه </a>

      <svg class="icon"><use href="#icon-angle-left"></use></svg>

      <span> فروشگاه </span>
    </section>

    <!-- ================= SHOP ================= -->

    <section class="shop">
      <!-- دکمه‌ی باز کردن فیلتر، فقط تو موبایل دیده می‌شه -->
      <button type="button" id="filterToggleBtn" class="filter-toggle-btn">
        <svg class="icon"><use href="#icon-sliders"></use></svg>
        فیلتر محصولات
      </button>

      <!-- پس‌زمینه‌ی تیره‌ی پشت کشو، فقط تو موبایل -->
      <div class="filter-overlay" id="filterOverlay"></div>

      <!-- ================= SIDEBAR ================= -->

      <aside class="shop-sidebar" id="shopSidebar">
        <div class="filter-head">
          <h2>فیلتر محصولات</h2>
          <button
            type="button"
            id="filterCloseBtn"
            class="filter-close-btn"
            aria-label="بستن فیلتر"
          >
            <svg class="icon"><use href="#icon-xmark"></use></svg>
          </button>
          <button type="button" id="clearFilters" class="clear-filters-btn">
            پاک کردن فیلترها
          </button>
        </div>

        <!-- Category Filter -->

        <div class="filter-box">
          <h3>دسته بندی</h3>

          <label>
            <input type="checkbox" class="filter-category" value="laptops" />
            لپ تاپ
          </label>

          <label>
            <input type="checkbox" class="filter-category" value="mobiles" />
            موبایل
          </label>

          <label>
            <input type="checkbox" class="filter-category" value="monitors" />
            مانیتور
          </label>

          <label>
            <input type="checkbox" class="filter-category" value="headphones" />
            هدفون
          </label>

          <label>
            <input type="checkbox" class="filter-category" value="accessories" />
            لوازم جانبی
          </label>
        </div>

        <!-- Brand Filter -->

        <div class="filter-box">
          <h3>برند</h3>

          <label>
            <input type="checkbox" class="filter-brand" value="ASUS" />
            ASUS
          </label>

          <label>
            <input type="checkbox" class="filter-brand" value="Apple" />
            Apple
          </label>

          <label>
            <input type="checkbox" class="filter-brand" value="Samsung" />
            Samsung
          </label>

          <label>
            <input type="checkbox" class="filter-brand" value="Lenovo" />
            Lenovo
          </label>

          <label>
            <input type="checkbox" class="filter-brand" value="MSI" />
            MSI
          </label>

          <label>
            <input type="checkbox" class="filter-brand" value="HP" />
            HP
          </label>
        </div>

        <!-- Price Filter -->

        <div class="filter-box">
          <h3>محدوده قیمت</h3>

          <input
            type="range"
            id="priceFilter"
            min="1000000"
            max="100000000"
            step="1000000"
            value="100000000"
          />
          <div class="price-filter-value">
            تا <span id="priceFilterValue">100,000,000</span> تومان
          </div>
        </div>

        <!-- Empty State -->
        <div class="filter-empty" id="filterEmpty" style="display: none">
          محصولی با این فیلترها پیدا نشد
        </div>
      </aside>

      <!-- ================= CONTENT ================= -->

      <main class="shop-content">
        <!-- ================= LAPTOPS ================= -->

        <section class="shop-section">
          <div class="section-header">
            <h2>💻 لپ تاپ</h2>

            <a href="#"> مشاهده همه </a>
          </div>

          <div class="products-grid" id="laptops"></div>

          <div class="load-more-container">
            <button type="button" class="load-more-btn" data-category="laptops">
              نمایش بیشتر

              <svg class="icon"><use href="#icon-chevron-down"></use></svg>
            </button>
          </div>
        </section>

        <!-- ================= MOBILES ================= -->

        <section class="shop-section">
          <div class="section-header">
            <h2>📱 موبایل</h2>

            <a href="#"> مشاهده همه </a>
          </div>

          <div class="products-grid" id="mobiles"></div>

          <div class="load-more-container">
            <button type="button" class="load-more-btn" data-category="mobiles">
              نمایش بیشتر

              <svg class="icon"><use href="#icon-chevron-down"></use></svg>
            </button>
          </div>
        </section>

        <!-- ================= MONITORS ================= -->

        <section class="shop-section">
          <div class="section-header">
            <h2>🖥 مانیتور</h2>

            <a href="#"> مشاهده همه </a>
          </div>

          <div class="products-grid" id="monitors"></div>

          <div class="load-more-container">
            <button
              type="button"
              class="load-more-btn"
              data-category="monitors"
            >
              نمایش بیشتر

              <svg class="icon"><use href="#icon-chevron-down"></use></svg>
            </button>
          </div>
        </section>

        <!-- ================= HEADPHONES ================= -->

        <section class="shop-section">
          <div class="section-header">
            <h2>🎧 هدفون</h2>

            <a href="#"> مشاهده همه </a>
          </div>

          <div class="products-grid" id="headphones"></div>

          <div class="load-more-container">
            <button
              type="button"
              class="load-more-btn"
              data-category="headphones"
            >
              نمایش بیشتر

              <svg class="icon"><use href="#icon-chevron-down"></use></svg>
            </button>
          </div>
        </section>

        <!-- ================= ACCESSORIES ================= -->

        <section class="shop-section">
          <div class="section-header">
            <h2>⌨️ لوازم جانبی</h2>

            <a href="#"> مشاهده همه </a>
          </div>

          <div class="products-grid" id="accessories"></div>

          <div class="load-more-container">
            <button
              type="button"
              class="load-more-btn"
              data-category="accessories"
            >
              نمایش بیشتر

              <svg class="icon"><use href="#icon-chevron-down"></use></svg>
            </button>
          </div>
        </section>
      </main>
    </section>

    <!-- =========================================
                     Product Modal
        ========================================= -->

    <div class="product-modal" id="productModal">
      <!-- Overlay -->
      <div class="modal-overlay" id="modalOverlay"></div>

      <!-- Modal -->
      <div class="modal-content"></div>

        <button
          type="button"
          class="modal-close"
          id="modalClose"
          aria-label="بستن"
        >
          <svg class="icon"><use href="#icon-xmark"></use></svg>
        </button>

        <!-- Product Image -->

        <div class="modal-image">
          <img id="modalProductImage" src="" alt="" />
        </div>

        <div class="modal-info">
        
          <span class="modal-badge" id="modalProductBadge"> تخفیف </span>

          <h2 id="modalProductName">نام محصول</h2>
          <p class="modal-spec" id="modalProductSpec">مشخصات محصول</p>
          <div class="modal-price" id="modalProductPrice">0 تومان</div>
          <div class="modal-actions">
            <!-- Add To Cart -->
            <button type="button" class="modal-cart-btn" id="modalAddToCart">
              <svg class="icon"><use href="#icon-cart-plus"></use></svg>
              افزودن به سبد خرید
            </button>

            <!-- Favorite -->

            <button
              type="button"
              class="modal-favorite-btn"
              id="modalFavorite"
              aria-label="افزودن به علاقه‌مندی"
            >
              <svg class="icon"><use href="#icon-heart-outline"></use></svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="products-data.js"></script>
    <script src="shop.js"></script>
  </body>
</html>
