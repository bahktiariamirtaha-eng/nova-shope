<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>سبد خرید | Nova Digital</title>

    <link rel="stylesheet" href="cart.css" />
  </head>

  <body>
    <script src="icons.js"></script>
    <header>
      <div class="header-container">
        <div class="header-actions">
          <button
            class="header-menu-toggle"
            type="button"
            aria-label="باز کردن منو"
          >
            <svg class="icon"><use href="#icon-ellipsis"></use></svg>
          </button>

          <div class="header-menu-items">
            <a
              href="favorites.html"
              class="header-menu-item"
              aria-label="علاقه‌مندی‌ها"
            >
              <svg class="icon"><use href="#icon-heart-outline"></use></svg>
            </a>

            <a
              href="account.html"
              class="header-menu-item"
              aria-label="حساب کاربری"
            >
              <svg class="icon"><use href="#icon-user"></use></svg>
            </a>

            <a href="cart.html" class="header-menu-item" aria-label="سبد خرید">
              <svg class="icon"><use href="#icon-cart-shopping"></use></svg>
              <span class="cart-count">0</span>
            </a>
          </div>
        </div>
      </div>
    </header>

    <!-- Breadcrumb -->

    <section class="breadcrumb">
      <a href="index.html"> خانه </a>

      <span>/</span>

      <span> سبد خرید </span>
    </section>

    <!-- Cart -->

    <main class="cart-page">
      <div class="cart-header">
        <h1>سبد خرید</h1>

        <span id="cartCount"> 0 محصول </span>
      </div>

      <div class="cart-layout">
        <!-- Products -->

        <section class="cart-products" id="cartProducts">
          <!-- محصولات توسط JavaScript اینجا ساخته می‌شوند -->
        </section>

        <!-- Summary -->

        <aside class="cart-summary">
          <h2>خلاصه سفارش</h2>

          <div class="summary-row">
            <span> تعداد محصولات </span>

            <strong id="summaryCount"> 0 </strong>
          </div>

          <div class="summary-row">
            <span> مجموع قیمت </span>

            <strong id="subtotal"> 0 تومان </strong>
          </div>

          <div class="summary-row">
            <span> هزینه ارسال </span>

            <strong id="shipping"> رایگان </strong>
          </div>

          <div class="summary-divider"></div>

          <div class="summary-total">
            <span> مبلغ نهایی </span>

            <strong id="totalPrice"> 0 تومان </strong>
          </div>

          <button class="checkout-btn" id="checkoutBtn" type="button">
            ادامه فرایند خرید

            <svg class="icon"><use href="#icon-arrow-left"></use></svg>
          </button>

         
        </aside>
      </div>
    </main>

    <footer></footer>

    <script src="cart.js"></script>
  </body>
</html>
