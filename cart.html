<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>سبد خرید | Nova Digital</title>

    <link rel="stylesheet" href="cart.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>

  <body>
    <header>
      <!-- هدر اصلی سایت بعداً اینجا قرار می‌گیرد -->
    </header>

    <!-- Breadcrumb -->

    <section class="breadcrumb">
      <a href="index.html"> خانه </a>

      <span>/</span>

      <span> سبد خرید </span>
    </section>

    <!-- Cart -->

    <main class="cart-page">
      <div class="cart-header">
        <h1>سبد خرید</h1>

        <span id="cartCount"> 0 محصول </span>
      </div>

      <div class="cart-layout">
        <!-- Products -->

        <section class="cart-products" id="cartProducts">
          <!-- محصولات توسط JavaScript اینجا ساخته می‌شوند -->
        </section>

        <!-- Summary -->

        <aside class="cart-summary">
          <h2>خلاصه سفارش</h2>

          <div class="summary-row">
            <span> تعداد محصولات </span>

            <strong id="summaryCount"> 0 </strong>
          </div>

          <div class="summary-row">
            <span> مجموع قیمت </span>

            <strong id="subtotal"> 0 تومان </strong>
          </div>

          <div class="summary-row">
            <span> هزینه ارسال </span>

            <strong id="shipping"> رایگان </strong>
          </div>

          <div class="summary-divider"></div>

          <div class="summary-total">
            <span> مبلغ نهایی </span>

            <strong id="totalPrice"> 0 تومان </strong>
          </div>

          <button class="checkout-btn" id="checkoutBtn" type="button">
            ادامه فرایند خرید

            <i class="fa-solid fa-arrow-left"></i>
          </button>

          <a href="shope.html" class="continue-shopping">
            <i class="fa-solid fa-arrow-right"></i>

            ادامه خرید
          </a>
        </aside>
      </div>
    </main>

    <footer>
      <!-- فوتر اصلی سایت -->
    </footer>

    <script src="cart.js"></script>
  </body>
</html>
