<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>علاقه‌مندی‌ها | Nova Digital</title>

    <link rel="stylesheet" href="favorites.css" />
  </head>

  <body>
    <script src="icons.js"></script>
    <header>
      <div class="header-container">
        <div class="header-actions">
          <button
            class="header-menu-toggle"
            type="button"
            aria-label="باز کردن منو"
          >
            <svg class="icon"><use href="#icon-ellipsis"></use></svg>
          </button>

          <div class="header-menu-items">
            <a
              href="account.html"
              class="header-menu-item"
              aria-label="حساب کاربری"
            >
              <svg class="icon"><use href="#icon-user"></use></svg>
            </a>

            <a href="index.html" class="header-menu-item" aria-label="خانه">
              <svg class="icon"><use href="#icon-house"></use></svg>
            </a>

            <a href="cart.html" class="header-menu-item" aria-label="سبد خرید">
              <svg class="icon"><use href="#icon-cart-shopping"></use></svg>
              <span class="cart-count">0</span>
            </a>
          </div>
        </div>
      </div>
    </header>

    <!-- Breadcrumb -->

    <section class="breadcrumb">
      <a href="index.html"> خانه </a>

      <svg class="icon"><use href="#icon-angle-left"></use></svg>

      <span> علاقه‌مندی‌ها </span>
    </section>

    <!-- Favorites -->

    <main class="fav-page">
      <div class="fav-header">
        <h1>علاقه‌مندی‌ها</h1>
        <span id="favCount">0 محصول</span>
      </div>

      <section class="fav-products" id="favProducts">
        <!-- محصولات توسط JavaScript اینجا ساخته می‌شوند -->
      </section>
    </main>

    <script src="favorites.js"></script>
  </body>
</html>
